{% extends "base.html" %}

{% block content %}

<h1>🔑 Reset Customer Password</h1>
<p class="sub">Reset password for: <b>{{ customer.full_name }}</b></p>

<div class="card">
    <div style="background:#f8f9fa;padding:15px;border-radius:8px;margin-bottom:20px;">
        <div class="grid">
            <div class="metric">
                <div class="label">Customer</div>
                <div class="value" style="font-size:18px;">{{ customer.full_name }}</div>
            </div>
            <div class="metric">
                <div class="label">Username</div>
                <div class="value" style="font-size:18px;">{{ customer.username }}</div>
            </div>
            <div class="metric">
                <div class="label">Phone</div>
                <div class="value" style="font-size:18px;">{{ customer.phone }}</div>
            </div>
        </div>
    </div>
    
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="formgrid">


            <label style="grid-column: span 2;">
                New Password (minimum 10 characters)
                <div style="position: relative;">
                    <input type="password" name="new_password" id="resetCustPass"
                           placeholder="At least 10 chars, with letter + number + symbol"
                           required minlength="10" maxlength="64"
                           title="At least 10 characters, with a letter, a number, and a special character"
                           style="width:100%; padding:10px; padding-right:40px; box-sizing:border-box;">
                    <span onclick="togglePassword('resetCustPass', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; color: #667085; user-select: none;">
                        👁️
                    </span>
                </div>
                <small style="color:#667085;display:block;margin-top:5px;">
                    ⚠️ Must be at least 10 characters, with a letter, a number, and a special character.
                    The customer will need to use this new password to login.
                </small>
            </label>



        </div>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn yellow" type="submit">🔄 Reset Password</button>
            <a href="{{ url_for('customers') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

<div class="actions">
    <a href="{{ url_for('customers') }}" class="btn">← Back to Customers</a>
</div>

<script>
function togglePassword(inputId, iconElement) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        iconElement.innerHTML = "🙈"; // Change icon to closed eyes
        iconElement.style.color = "#0d1f46"; // Highlight color
    } else {
        input.type = "password";
        iconElement.innerHTML = "👁️"; // Change icon back to open eyes
        iconElement.style.color = "#667085"; // Default color
    }
}
</script>


{% endblock %}
